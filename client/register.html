<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up  3FTERS</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-brand">
    <a href="/index.html">
      <h1>3FTERS</h1>
      <p>Thrift Everything</p>
    </a>
  </div>

  <div class="auth-card">
    <h2>Create account</h2>
    <p class="auth-sub">Join thousands of thrifters</p>

    <div id="authError"   class="auth-error   hidden"></div>
    <div id="authSuccess" class="auth-success hidden"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="John Doe">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@email.com">
    </div>

    <div class="form-group">
      <label>Phone (for M-Pesa)</label>
      <input type="tel" id="regPhone" placeholder="0712345678">
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="regPassword" placeholder="Min 6 characters">
        <span class="toggle-pw" id="togglePw">👁</span>
      </div>
    </div>

    <div class="form-group">
      <label>I want to</label>
      <div class="role-selector">
        <div class="role-option selected" data-role="buyer">
          <span>🛍️</span>
          <strong>Buy</strong>
          <p>Shop thrift finds</p>
        </div>
        <div class="role-option" data-role="seller">
          <span>🏷️</span>
          <strong>Sell</strong>
          <p>List my thrift items</p>
        </div>
      </div>
    </div>

    <button class="auth-btn" id="registerBtn">Create Account</button>

    <div class="auth-divider"><span>or</span></div>

    <p class="auth-switch">
      Already have an account? <a href="/client/login.html">Log in</a>
    </p>
  </div>
</div>

<script type="module">
  import { register } from './js/auth.js';

  let selectedRole = 'buyer';

  document.querySelectorAll('.role-option').forEach(option => {
    option.addEventListener('click', () => {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
      option.classList.add('selected');
      selectedRole = option.dataset.role;
    });
  });

  document.getElementById('togglePw').addEventListener('click', () => {
    const input = document.getElementById('regPassword');
    input.type  = input.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('registerBtn').addEventListener('click', async () => {
    const name      = document.getElementById('regName').value.trim();
    const email     = document.getElementById('regEmail').value.trim();
    const phone     = document.getElementById('regPhone').value.trim();
    const password  = document.getElementById('regPassword').value;
    const btn       = document.getElementById('registerBtn');
    const errorEl   = document.getElementById('authError');
    const successEl = document.getElementById('authSuccess');

    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');

    if (!name || !email || !phone || !password) {
      errorEl.textContent = 'Please fill in all fields';
      errorEl.classList.remove('hidden');
      return;
    }

    if (password.length < 6) {
      errorEl.textContent = 'Password must be at least 6 characters';
      errorEl.classList.remove('hidden');
      return;
    }

    btn.textContent = 'Creating account...';
    btn.disabled    = true;

    const { error } = await register(email, password, {
      full_name: name,
      phone,
      role: selectedRole
    });

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
      btn.textContent = 'Create Account';
      btn.disabled    = false;
    } else {
      successEl.textContent = '✅ Account created successfully!';
      successEl.classList.remove('hidden');
      btn.textContent = 'Done!';

      // Redirect to login after 2 seconds
      setTimeout(() => {
        window.location.href = '/client/login.html';
      }, 2000);
    }
  });
</script>

</body>
</html>
