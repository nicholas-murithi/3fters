<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seller Dashboard  3FTERS</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="background:#f5f5f5;padding:0">

<header class="header" style="background:white;padding:15px 30px;box-shadow:0 1px 10px rgba(0,0,0,0.06)">
  <div class="logo">3FTERS Seller</div>
  <nav style="display:flex;gap:20px;align-items:center">
    <a href="#listings"  style="text-decoration:none;color:#111;font-size:14px">My Listings</a>
    <a href="#orders"    style="text-decoration:none;color:#111;font-size:14px">Orders</a>
    <button id="logoutBtn" class="logout-btn">Log out</button>
  </nav>
</header>

<main style="max-width:1100px;margin:0 auto;padding:30px 20px">

  <!-- STATS -->
  <section style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:35px">
    <div style="background:white;border-radius:16px;padding:20px;text-align:center">
      <div id="totalListings" style="font-size:32px;font-weight:700">0</div>
      <p style="color:#777;font-size:13px;margin-top:5px">Active Listings</p>
    </div>
    <div style="background:white;border-radius:16px;padding:20px;text-align:center">
      <div id="totalSold" style="font-size:32px;font-weight:700">0</div>
      <p style="color:#777;font-size:13px;margin-top:5px">Items Sold</p>
    </div>
    <div style="background:white;border-radius:16px;padding:20px;text-align:center">
      <div id="totalEarnings" style="font-size:32px;font-weight:700">KSh 0</div>
      <p style="color:#777;font-size:13px;margin-top:5px">Earnings</p>
    </div>
    <div style="background:white;border-radius:16px;padding:20px;text-align:center">
      <div id="pendingOrders" style="font-size:32px;font-weight:700">0</div>
      <p style="color:#777;font-size:13px;margin-top:5px">Pending Orders</p>
    </div>
  </section>

  <!-- ADD LISTING -->
  <section style="background:white;border-radius:20px;padding:30px;margin-bottom:35px" id="listings">
    <h2 style="margin-bottom:20px">Add New Listing</h2>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="listingTitle" placeholder="e.g. Vintage Nike Air Max">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="listingDesc" rows="3" placeholder="Describe the item, condition, any flaws..."></textarea>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px">
      <div class="form-group">
        <label>Price (KSh)</label>
        <input type="number" id="listingPrice" placeholder="500">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="listingCategory">
          <option value="">Select</option>
          <option value="shoes">Shoes</option>
          <option value="jacket">Jacket</option>
          <option value="tee">Vintage Tee</option>
          <option value="cap">Cap</option>
          <option value="streetwear">Streetwear</option>
          <option value="accessories">Accessories</option>
        </select>
      </div>
      <div class="form-group">
        <label>Size</label>
        <select id="listingSize">
          <option value="">Select</option>
          <option>XS</option><option>S</option><option>M</option>
          <option>L</option><option>XL</option><option>XXL</option>
          <option>38</option><option>39</option><option>40</option>
          <option>41</option><option>42</option><option>43</option><option>44</option>
        </select>
      </div>
      <div class="form-group">
        <label>Condition</label>
        <select id="listingCondition">
          <option value="like new">Like New</option>
          <option value="good">Good</option>
          <option value="fair">Fair</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Photos (up to 5)</label>
      <div id="uploadBox"
        style="border:2px dashed #ddd;border-radius:12px;padding:30px;text-align:center;cursor:pointer">
        <input type="file" id="imageInput" accept="image/*" multiple hidden>
        <p style="color:#777">📷 Click to upload photos</p>
      </div>
      <div id="imagePreviews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>
    </div>

    <button class="auth-btn" id="submitListing" style="max-width:200px">Post Listing</button>
  </section>

  <!-- MY LISTINGS -->
  <section style="margin-bottom:35px">
    <h2 style="margin-bottom:20px">My Listings</h2>
    <div id="sellerListings"
      style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px">
    </div>
  </section>

  <!-- ORDERS -->
  <section id="orders">
    <h2 style="margin-bottom:20px">Incoming Orders</h2>
    <div id="sellerOrders"></div>
  </section>

</main>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
