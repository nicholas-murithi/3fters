<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset password  3FTERS</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#5a3a22">
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-brand">
    <a href="../index.html">
      <h1>3FTERS</h1>
      <p>Thrift Everything</p>
    </a>
  </div>

  <div class="auth-card">
    <h2>Reset your password</h2>

    <div id="authError" class="auth-error hidden"></div>
    <div id="authInfo" class="hidden"
         style="background:#eef7ee;color:#2d5a2d;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;"></div>

    <!-- STEP 1: ask for the email -->
    <div id="step1">
      <p class="auth-sub">Enter your account email. We will text a 6-digit code to the phone number on your account.</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="fpEmail" placeholder="you@email.com" autocomplete="email">
      </div>
      <button class="auth-btn" id="sendBtn">Send code</button>
    </div>

    <!-- STEP 2: code + new password -->
    <div id="step2" class="hidden">
      <p class="auth-sub">Enter the 6-digit code we texted you and choose a new password.</p>
      <div class="form-group">
        <label>6-digit code</label>
        <input type="text" id="fpCode" placeholder="123456" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6">
      </div>
      <div class="form-group">
        <label>New password</label>
        <div class="password-wrap">
          <input type="password" id="fpPassword" placeholder="At least 6 characters" autocomplete="new-password">
          <span class="toggle-pw" id="togglePw">👁</span>
        </div>
      </div>
      <button class="auth-btn" id="resetBtn">Set new password</button>
      <p class="auth-switch">
        Did not get a code? <a href="#" id="resendLink">Send it again</a>
      </p>
    </div>

    <p class="auth-switch">
      <a href="login.html">Back to login</a>
    </p>
  </div>
</div>

<script>
  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:5000/api'
    : 'https://threefters.onrender.com/api';

  const $ = id => document.getElementById(id);
  let email = '';

  function show(el, text) { el.textContent = text; el.classList.remove('hidden'); }
  function hide(el)       { el.classList.add('hidden'); }

  async function post(path, body) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000); // Render free tier can be slow to wake
    try {
      const res  = await fetch(API + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: controller.signal
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, data };
    } catch (err) {
      return { ok: false, data: { error: err.name === 'AbortError'
        ? 'The server is taking too long. Please try again in a moment.'
        : 'Something went wrong. Please check your connection and try again.' } };
    } finally {
      clearTimeout(timer);
    }
  }

  async function sendCode(isResend) {
    hide($('authError')); hide($('authInfo'));
    email = $('fpEmail').value.trim() || email;
    if (!email) { show($('authError'), 'Please enter your email address'); return; }

    const btn = $('sendBtn');
    btn.disabled = true; btn.textContent = 'Sending...';
    const { ok, data } = await post('/auth/forgot-password', { email });
    btn.disabled = false; btn.textContent = 'Send code';

    if (!ok) { show($('authError'), data.error || 'Could not send the code.'); return; }

    hide($('step1')); $('step2').classList.remove('hidden');
    show($('authInfo'), isResend
      ? 'If your account has a phone number, a new code is on its way.'
      : data.message);
    $('fpCode').focus();
  }

  $('sendBtn').addEventListener('click', () => sendCode(false));
  $('resendLink').addEventListener('click', e => { e.preventDefault(); sendCode(true); });

  $('resetBtn').addEventListener('click', async () => {
    hide($('authError'));
    const code     = $('fpCode').value.trim();
    const password = $('fpPassword').value;

    if (!/^\d{6}$/.test(code)) { show($('authError'), 'Enter the 6-digit code from the SMS'); return; }
    if (password.length < 6)   { show($('authError'), 'Password must be at least 6 characters'); return; }

    const btn = $('resetBtn');
    btn.disabled = true; btn.textContent = 'Saving...';
    const { ok, data } = await post('/auth/reset-password', { email, code, new_password: password });

    if (!ok) {
      show($('authError'), data.error || 'Could not reset your password.');
      btn.disabled = false; btn.textContent = 'Set new password';
      return;
    }

    // The server logs them straight in, same as a normal login.
    localStorage.setItem('3fters_token', data.token);
    localStorage.setItem('3fters_user',  JSON.stringify(data.user));
    window.location.href = data.user.role === 'admin' ? '/client/admin.html' : '/index.html';
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    ($('step2').classList.contains('hidden') ? $('sendBtn') : $('resetBtn')).click();
  });

  $('togglePw').addEventListener('click', () => {
    const input = $('fpPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
  });
</script>
</body>
</html>
