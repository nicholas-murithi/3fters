<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login  3FTERS</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-brand">
    <a href="../index.html">
      <h1>3FTERS</h1>
      <p>Thrift Everything</p>
    </a>
  </div>

  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to your account</p>

    <div id="authError" class="auth-error hidden"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@email.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="loginPassword" placeholder="Your password">
        <span class="toggle-pw" id="togglePw">👁</span>
      </div>
    </div>

    <button class="auth-btn" id="loginBtn">Log In</button>

    <div class="auth-divider"><span>or</span></div>

    <div id="g_id_onload"
      data-client_id="12095222317-2efhrk4uvtf8mnam31gb65tih1vmm8p3.apps.googleusercontent.com"
      data-callback="handleGoogleCredential"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="pill"
      data-theme="outline"
      data-text="continue_with"
      data-size="large"
      data-width="100%"
      style="display:flex;justify-content:center;margin-bottom:15px">
    </div>

    <p class="auth-switch">
      Don't have an account? <a href="register.html">Sign up</a>
    </p>
  </div>
</div>

<script type="module">
  import { login, loginWithGoogle } from './js/auth.js';

  // Google Identity Services calls this by name (see data-callback above),
  // so it has to live on window, not stay a module-scoped import.
  window.handleGoogleCredential = async (response) => {
    const errorEl = document.getElementById('authError');
    errorEl.classList.add('hidden');

    const { error } = await loginWithGoogle(response.credential);

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
    }
  };

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn      = document.getElementById('loginBtn');
    const errorEl  = document.getElementById('authError');

    errorEl.classList.add('hidden');

    if (!email || !password) {
      errorEl.textContent = 'Please fill in all fields';
      errorEl.classList.remove('hidden');
      return;
    }

    btn.textContent = 'Logging in...';
    btn.disabled    = true;

    const { error } = await login(email, password);

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
      btn.textContent = 'Log In';
      btn.disabled    = false;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('togglePw').addEventListener('click', () => {
    const input = document.getElementById('loginPassword');
    input.type  = input.type === 'password' ? 'text' : 'password';
  });
</script>

</body>
</html>
