<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin  3FTERS</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
    .admin-table { min-width: 640px; }

    @media (max-width: 768px) {
      #statsGrid { gap: 10px !important; padding: 15px !important; }
      #statsGrid > div { padding: 12px 6px !important; }
      #statsGrid > div > div:first-child { font-size: 18px !important; }
      #statsGrid > div > p { font-size: 10px !important; margin-top: 3px !important; }
      header.header { padding: 12px 16px !important; flex-wrap: wrap; gap: 10px; }
      header.header nav { gap: 10px !important; flex-wrap: wrap; }
      main { padding: 0 16px 30px !important; }
    }
  </style>
</head>
<body style="background:#f5f5f5;padding:0">

<header class="header" style="background:white;padding:15px 30px;
  box-shadow:0 1px 10px rgba(0,0,0,0.06)">
  <div class="logo">3FTERS Admin</div>
  <nav style="display:flex;gap:20px;align-items:center">
    <button onclick="showTab('users')"   class="tab-btn active" id="tab-users">Users</button>
    <button onclick="showTab('listings')" class="tab-btn"        id="tab-listings">Listings</button>
    <button onclick="showTab('orders')"  class="tab-btn"        id="tab-orders">Orders</button>
    <button onclick="adminLogout()" class="logout-btn">Log out</button>
  </nav>
</header>

<!-- STATS -->
<div id="statsGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
  padding:25px 30px;max-width:1200px;margin:0 auto">
  <div style="background:white;border-radius:16px;padding:20px;text-align:center">
    <div id="statUsers" style="font-size:32px;font-weight:700">—</div>
    <p style="color:#777;font-size:13px;margin-top:5px">Total Users</p>
  </div>
  <div style="background:white;border-radius:16px;padding:20px;text-align:center">
    <div id="statListings" style="font-size:32px;font-weight:700">—</div>
    <p style="color:#777;font-size:13px;margin-top:5px">Total Listings</p>
  </div>
  <div style="background:white;border-radius:16px;padding:20px;text-align:center">
    <div id="statOrders" style="font-size:32px;font-weight:700">—</div>
    <p style="color:#777;font-size:13px;margin-top:5px">Total Orders</p>
  </div>
  <div style="background:white;border-radius:16px;padding:20px;text-align:center">
    <div id="statRevenue" style="font-size:32px;font-weight:700">—</div>
    <p style="color:#777;font-size:13px;margin-top:5px">Total Revenue</p>
  </div>
</div>

<main style="max-width:1200px;margin:0 auto;padding:0 30px 40px">

  <!-- USERS TAB -->
  <div id="tabUsers">
    <h2 style="margin-bottom:20px">All Users</h2>
    <div id="usersList"></div>
  </div>

  <!-- LISTINGS TAB -->
  <div id="tabListings" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2>All Listings</h2>
      <button onclick="openAddListing()" class="tab-btn active" style="padding:9px 18px">+ Add Listing</button>
    </div>
    <div id="listingsList"></div>
  </div>

  <!-- ADD LISTING MODAL -->
  <div id="addListingModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
    z-index:9999;align-items:center;justify-content:center;padding:20px">
    <div style="background:white;border-radius:16px;padding:25px;max-width:480px;width:100%;
      max-height:90vh;overflow-y:auto">
      <h3 style="margin-bottom:15px">Add New Listing</h3>

      <div id="addListingError" style="display:none;background:#fee2e2;color:#991b1b;
        padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px"></div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Images (up to 5)</label>
          <input type="file" id="listingImages" accept="image/*" multiple
            style="width:100%;font-size:13px">
        </div>
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Title</label>
          <input type="text" id="listingTitleInput" placeholder="e.g. Nike Sweatpants"
            style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
        </div>
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Description</label>
          <textarea id="listingDescInput" rows="3" placeholder="Short description"
            style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:vertical"></textarea>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Price (KSh)</label>
            <input type="number" id="listingPriceInput" placeholder="1500"
              style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
          </div>
          <div style="flex:1">
            <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Original Price (optional — for sale items)</label>
            <input type="number" id="listingOriginalPriceInput" placeholder="e.g. 2000"
              style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Size</label>
            <input type="text" id="listingSizeInput" placeholder="M / 40"
              style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Category</label>
            <select id="listingCategoryInput"
              style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
              <optgroup label="Trousers">
                <option value="jeans">Jeans</option>
                <option value="sweatpants">Sweatpants</option>
                <option value="official-pants">Official Pants</option>
                <option value="sporttracks">Sport Tracks</option>
              </optgroup>
              <optgroup label="Tops">
                <option value="shirts">Shirts</option>
                <option value="tee">Vintage Tee</option>
                <option value="jacket">Jacket</option>
              </optgroup>
              <optgroup label="Other Wear">
                <option value="shorts">Shorts</option>
                <option value="streetwear">Streetwear</option>
              </optgroup>
              <optgroup label="Footwear">
                <option value="shoes">Casual Shoes</option>
                <option value="official-shoes">Official Shoes</option>
                <option value="socks">Socks</option>
              </optgroup>
              <optgroup label="Accessories">
                <option value="belts">Belts</option>
                <option value="ties">Ties</option>
                <option value="cap">Cap</option>
                <option value="accessories">Other Accessories</option>
              </optgroup>
            </select>
          </div>
          <div style="flex:1">
            <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Condition</label>
            <select id="listingConditionInput"
              style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
              <option value="like new">Like New</option>
              <option value="good">Good</option>
              <option value="fair">Fair</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Gender</label>
            <select id="listingGenderInput"
              style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
              <option value="unisex">Unisex</option>
              <option value="men">Gents</option>
              <option value="women">Ladies</option>
            </select>
          </div>
          <div style="flex:1">
            <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">Style (optional)</label>
            <select id="listingStyleInput"
              style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">
              <option value="">— None —</option>
              <option value="campus">Campus / Comrade Wear</option>
              <option value="corporate">Corporate / Official Wear</option>
              <option value="casual">Casual</option>
              <option value="streetwear">Streetwear</option>
            </select>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:20px">
        <button onclick="closeAddListing()" style="flex:1;padding:11px;border-radius:8px;
          border:1px solid #ddd;background:white;cursor:pointer;font-family:'Inter',sans-serif">Cancel</button>
        <button onclick="submitListing()" id="submitListingBtn" style="flex:1;padding:11px;border-radius:8px;
          border:none;background:black;color:white;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600">Publish</button>
      </div>
    </div>
  </div>

  <!-- ORDERS TAB -->
  <div id="tabOrders" style="display:none">
    <h2 style="margin-bottom:20px">All Orders</h2>
    <div id="ordersList"></div>
  </div>

</main>

<style>
  .tab-btn {
    background: none;
    border: 1px solid #ddd;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .tab-btn.active {
    background: black;
    color: white;
    border-color: black;
  }
  .admin-table {
    width: 100%;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border-collapse: collapse;
  }
  .admin-table th {
    background: #f9f9f9;
    padding: 12px 16px;
    text-align: left;
    font-size: 13px;
    color: #777;
    font-weight: 600;
  }
  .admin-table td {
    padding: 12px 16px;
    border-top: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .admin-table tr:hover td {
    background: #fafafa;
  }
</style>

<script type="module">
  const API = window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1'
  ? 'http://localhost:5000/api'
  : 'https://threefters.onrender.com/api';
  const token = localStorage.getItem('3fters_token');
  const user  = JSON.parse(localStorage.getItem('3fters_user') || '{}');

  // Protect — admin only
  if (!token || user.role !== 'admin') {
    alert('Admin access only');
    window.location.href = '/index.html';
  }

  const authHeaders = {
    'Content-Type':  'application/json',
    'Authorization': `Bearer ${token}`
  };

  // ========================
  // LOAD STATS
  // ========================
  async function loadStats() {
    const [usersRes, listingsRes, ordersRes] = await Promise.all([
      fetch(`${API}/admin/users`,    { headers: authHeaders }),
      fetch(`${API}/admin/listings`, { headers: authHeaders }),
      fetch(`${API}/admin/orders`,   { headers: authHeaders })
    ]);

    const users    = await usersRes.json();
    const listings = await listingsRes.json();
    const orders   = await ordersRes.json();

    document.getElementById('statUsers').textContent    = users.length;
    document.getElementById('statListings').textContent = listings.length;
    document.getElementById('statOrders').textContent   = orders.length;

    const revenue = orders
      .filter(o => o.status === 'paid' || o.status === 'delivered')
      .reduce((sum, o) => sum + Number(o.amount), 0);
    document.getElementById('statRevenue').textContent = `KSh ${revenue.toLocaleString()}`;

    renderUsers(users);
    renderListings(listings);
    renderOrders(orders);
  }

  // ========================
  // RENDER USERS
  // ========================
  function renderUsers(users) {
    document.getElementById('usersList').innerHTML = `
      <div class="table-scroll">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Joined</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td>${u.full_name}</td>
              <td>${u.email}</td>
              <td>${u.phone || '—'}</td>
              <td><span class="badge ${u.role}">${u.role}</span></td>
              <td>${new Date(u.created_at).toLocaleDateString()}</td>
              <td style="display:flex;gap:6px">
                ${u.role === 'seller' ? `
                  <button onclick="makeBuyer('${u.id}')"
                    style="padding:5px 10px;background:#dcfce7;border:1px solid #86efac;
                      border-radius:6px;cursor:pointer;font-size:12px">
                    Make Buyer
                  </button>
                ` : ''}
                <button onclick="deleteUser('${u.id}')"
                  style="padding:5px 10px;background:#fee2e2;border:1px solid #fca5a5;
                    border-radius:6px;cursor:pointer;font-size:12px">
                  Delete
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;
  }

  // ========================
  // RENDER LISTINGS
  // ========================
  function renderListings(listings) {
    document.getElementById('listingsList').innerHTML = `
      <div class="table-scroll">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Price</th>
            <th>Category</th>
            <th>Status</th>
            <th>Posted</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${listings.map(l => `
            <tr>
              <td>
                <img src="${l.images?.[0] || '/eimages/placeholder.png'}"
                  style="width:45px;height:45px;border-radius:8px;object-fit:cover">
              </td>
              <td>${l.title}</td>
              <td>KSh ${Number(l.price).toLocaleString()}</td>
              <td>${l.category || '—'}</td>
              <td><span class="badge ${l.status}">${l.status}</span></td>
              <td>${new Date(l.created_at).toLocaleDateString()}</td>
              <td>
                <button onclick="deleteListing('${l.id}')"
                  style="padding:5px 10px;background:#fee2e2;border:1px solid #fca5a5;
                    border-radius:6px;cursor:pointer;font-size:12px">
                  Delete
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;
  }

  // ========================
  // RENDER ORDERS
  // ========================
  function renderOrders(orders) {
    document.getElementById('ordersList').innerHTML = `
      <div class="table-scroll">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Buyer</th>
            <th>Amount</th>
            <th>M-Pesa Code</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          ${orders.map(o => `
            <tr>
              <td>${o.title || '—'}</td>
              <td>${o.buyer_name || '—'}</td>
              <td>KSh ${Number(o.amount).toLocaleString()}</td>
              <td>${o.mpesa_code || '—'}</td>
              <td>
                <select onchange="updateOrderStatus('${o.id}', this.value)"
                  style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:12px">
                  ${['pending','paid','shipped','delivered','cancelled'].map(s => `
                    <option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>
                  `).join('')}
                </select>
              </td>
              <td>${new Date(o.created_at).toLocaleDateString()}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;
  }

  // ========================
  // UPDATE ORDER STATUS (manual, for WhatsApp checkout flow)
  // ========================
  window.updateOrderStatus = async function(id, status) {
    const res = await fetch(`${API}/orders/${id}/status`, {
      method:  'PATCH',
      headers: authHeaders,
      body:    JSON.stringify({ status })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || 'Failed to update order status');
      loadStats();
      return;
    }
    loadStats();
  };

  // ========================
  // DELETE USER
  // ========================
  window.deleteUser = async function(id) {
    if (!confirm('Delete this user? This cannot be undone.')) return;
    await fetch(`${API}/admin/users/${id}`, {
      method:  'DELETE',
      headers: authHeaders
    });
    loadStats();
  };

  // ========================
  // CHANGE ROLE: SELLER -> BUYER
  // ========================
  window.makeBuyer = async function(id) {
    const res = await fetch(`${API}/admin/users/${id}/role`, {
      method:  'PATCH',
      headers: authHeaders,
      body:    JSON.stringify({ role: 'buyer' })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || 'Failed to update role');
      return;
    }
    loadStats();
  };

  window.convertAllSellers = async function() {
    if (!confirm('Convert every remaining seller account to buyer? This cannot be undone.')) return;
    const res  = await fetch(`${API}/admin/users/convert-sellers`, {
      method:  'PATCH',
      headers: authHeaders
    });
    const data = await res.json();
    alert(data.message || 'Done');
    loadStats();
  };

  // ========================
  // DELETE LISTING
  // ========================
  window.deleteListing = async function(id) {
    if (!confirm('Delete this listing?')) return;
    await fetch(`${API}/admin/listings/${id}`, {
      method:  'DELETE',
      headers: authHeaders
    });
    loadStats();
  };

  // ========================
  // ADD LISTING
  // ========================
  window.openAddListing = function() {
    document.getElementById('addListingModal').style.display = 'flex';
  };

  window.closeAddListing = function() {
    document.getElementById('addListingModal').style.display = 'none';
    document.getElementById('addListingError').style.display  = 'none';
    ['listingImages','listingTitleInput','listingDescInput','listingPriceInput','listingOriginalPriceInput','listingSizeInput']
      .forEach(id => document.getElementById(id).value = '');
  };

  window.submitListing = async function() {
    const errorEl = document.getElementById('addListingError');
    const btn     = document.getElementById('submitListingBtn');
    errorEl.style.display = 'none';

    const title       = document.getElementById('listingTitleInput').value.trim();
    const description = document.getElementById('listingDescInput').value.trim();
    const price       = document.getElementById('listingPriceInput').value;
    const originalPrice = document.getElementById('listingOriginalPriceInput').value;
    const size        = document.getElementById('listingSizeInput').value.trim();
    const category    = document.getElementById('listingCategoryInput').value;
    const condition   = document.getElementById('listingConditionInput').value;
    const gender      = document.getElementById('listingGenderInput').value;
    const style       = document.getElementById('listingStyleInput').value;
    const files       = document.getElementById('listingImages').files;

    if (!title || !price) {
      errorEl.textContent = 'Title and price are required.';
      errorEl.style.display = 'block';
      return;
    }

    const MAX_FILE_SIZE = 6 * 1024 * 1024; // 6MB, must match server limit
    const oversized = [...files].filter(f => f.size > MAX_FILE_SIZE);
    if (oversized.length > 0) {
      errorEl.textContent = `${oversized.length} file(s) exceed 6MB: ${oversized.map(f => f.name).join(', ')}. Please resize and try again.`;
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Publishing...';

    try {
      let images = [];

      if (files.length > 0) {
        const formData = new FormData();
        [...files].forEach(f => formData.append('images', f));

        const uploadRes = await fetch(`${API}/upload`, {
          method:  'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body:    formData
        });
        const uploadData = await uploadRes.json();
        if (!uploadRes.ok) throw new Error(uploadData.error || 'Image upload failed');
        images = uploadData.urls;
      }

      const res = await fetch(`${API}/listings`, {
        method:  'POST',
        headers: authHeaders,
        body:    JSON.stringify({ title, description, price, category, size, condition, images, gender, style, original_price: originalPrice || null })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to create listing');

      closeAddListing();
      loadStats();

    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publish';
    }
  };

  // ========================
  // TAB SWITCHING
  // ========================
  window.showTab = function(tab) {
    ['users','listings','orders'].forEach(t => {
      document.getElementById(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).style.display = 'none';
      document.getElementById(`tab-${t}`).classList.remove('active');
    });
    document.getElementById(`tab${tab.charAt(0).toUpperCase()+tab.slice(1)}`).style.display = 'block';
    document.getElementById(`tab-${tab}`).classList.add('active');
  };

  // ========================
  // LOGOUT
  // ========================
  window.adminLogout = function() {
    localStorage.clear();
    window.location.href = '/index.html';
  };

  loadStats();
</script>

</body>
</html>
