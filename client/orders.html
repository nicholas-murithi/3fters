<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders  3FTERS</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="logo"><a href="../index.html">3FTERS</a></div>
  <nav id="authNav" class="auth-nav"></nav>
</header>

<main style="max-width:900px;margin:0 auto;padding:40px 20px">
  <h1 style="margin-bottom:30px">My Orders</h1>

  <div id="ordersList">
    <div class="loading-state">Loading your orders...</div>
  </div>
</main>

<script type="module">
  import { updateNav, protectPage, getToken } from './js/auth.js';

  protectPage();
  updateNav();

  const API = window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1'
  ? 'http://localhost:5000/api'
  : 'https://threefters.onrender.com/api';
  const token = getToken();

  async function loadOrders() {
    const container = document.getElementById('ordersList');

    try {
      const res    = await fetch(`${API}/orders/my-orders`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const orders = await res.json();

      if (!orders.length) {
        container.innerHTML = `
          <div class="empty-state">
            <p>You have no orders yet.</p>
            <a href="../index.html" class="auth-btn"
              style="display:inline-block;margin-top:15px;text-decoration:none">
              Start Shopping
            </a>
          </div>`;
        return;
      }

      container.innerHTML = orders.map(order => `
        <div style="background:white;border-radius:20px;padding:25px;margin-bottom:20px">
          <div style="display:flex;gap:20px;align-items:center">
            <img
              src="${order.images?.[0] || 'eimages/placeholder.png'}"
              style="width:80px;height:80px;border-radius:12px;object-fit:cover"
            >
            <div style="flex:1">
              <h4 style="margin-bottom:5px">${order.title || 'Item'}</h4>
              <p style="font-size:13px;color:#777;margin-bottom:5px">
                Sold by: 3FTERS
              </p>
              <p style="font-weight:600">
                KSh ${Number(order.amount).toLocaleString()}
              </p>
            </div>
            <div style="text-align:right">
              <span class="badge ${order.status}">${order.status}</span>
              <p style="font-size:12px;color:#777;margin-top:8px">
                ${new Date(order.created_at).toLocaleDateString('en-KE', {
                  day: 'numeric', month: 'short', year: 'numeric'
                })}
              </p>
            </div>
          </div>

          <!-- ORDER TRACKING STEPS -->
          ${order.status === 'cancelled' ? `
            <div style="margin-top:20px;padding:12px 15px;background:#fef2f2;border-radius:10px;
                        color:#991b1b;font-size:13px;font-weight:600">
              ✕ This order was cancelled — the item is back on sale.
            </div>
          ` : `
          <div style="margin-top:20px">
            <div style="display:flex;justify-content:space-between;position:relative">
              <div style="position:absolute;top:12px;left:0;right:0;height:2px;background:#eee;z-index:0"></div>

              ${['pending','paid','shipped','delivered'].map(step => `
                <div style="text-align:center;position:relative;z-index:1">
                  <div style="
                    width:24px;height:24px;border-radius:50%;
                    background:${isStepDone(order.status, step) ? 'black' : '#eee'};
                    color:${isStepDone(order.status, step) ? 'white' : '#aaa'};
                    display:flex;align-items:center;justify-content:center;
                    font-size:12px;margin:0 auto 6px;
                  ">
                    ${isStepDone(order.status, step) ? '✓' : ''}
                  </div>
                  <p style="font-size:11px;color:${isStepDone(order.status, step) ? '#111' : '#aaa'};
                    text-transform:capitalize">
                    ${step}
                  </p>
                </div>
              `).join('')}
            </div>
          </div>
          `}

          ${order.mpesa_code ? `
            <div style="margin-top:15px;padding:10px 15px;background:#f8f5f2;
              border-radius:10px;font-size:13px;color:#555">
              M-Pesa Code: <strong>${order.mpesa_code}</strong>
            </div>
          ` : ''}

          ${order.status === 'pending' ? `
            <button
              onclick="cancelOrder('${order.id}')"
              style="margin-top:15px;background:none;border:1px solid #d64545;color:#d64545;
                     padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">
              Cancel order
            </button>
          ` : ''}

          ${order.status === 'delivered' ? `
            <div id="reviewSlot-${order.id}" style="margin-top:15px"></div>
          ` : ''}
        </div>
      `).join('');

      // After rendering, fill in review slots for delivered orders
      orders.filter(o => o.status === 'delivered').forEach(o => renderReviewSlot(o.id));

    } catch (err) {
      container.innerHTML = '<div class="empty-state">Could not load orders. Is the server running?</div>';
    }
  }

  // Show either "leave a review" form or a submitted state for delivered orders
  async function renderReviewSlot(orderId) {
    const slot = document.getElementById(`reviewSlot-${orderId}`);
    if (!slot) return;

    try {
      const res  = await fetch(`${API}/reviews/can-review/${orderId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      if (!data.canReview) {
        slot.innerHTML = `<p style="font-size:13px;color:#777">✓ Review submitted</p>`;
        return;
      }

      slot.innerHTML = `
        <div style="border-top:1px solid #eee;padding-top:15px">
          <p style="font-size:13px;font-weight:600;margin-bottom:8px">Rate this purchase</p>
          <div id="stars-${orderId}" style="font-size:22px;cursor:pointer;margin-bottom:8px">
            ${[1,2,3,4,5].map(n => `<span data-star="${n}" style="opacity:0.3">★</span>`).join('')}
          </div>
          <textarea id="comment-${orderId}" placeholder="Optional comment..."
            style="width:100%;padding:8px;border-radius:8px;border:1px solid #ddd;font-family:inherit;font-size:13px;min-height:50px"></textarea>
          <button onclick="submitReview('${orderId}')"
            style="margin-top:8px;background:black;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px">
            Submit Review
          </button>
        </div>
      `;

      let selected = 0;
      const starsEl = document.getElementById(`stars-${orderId}`);
      starsEl.querySelectorAll('span').forEach(star => {
        star.addEventListener('click', () => {
          selected = Number(star.dataset.star);
          starsEl.querySelectorAll('span').forEach(s => {
            s.style.opacity = Number(s.dataset.star) <= selected ? '1' : '0.3';
          });
          starsEl.dataset.selected = selected;
        });
      });
    } catch (err) {
      // Silently skip if reviews check fails, non-critical
    }
  }

  window.cancelOrder = async function(orderId) {
    if (!confirm('Cancel this order? The item will go back on sale for other buyers.')) return;

    try {
      const res = await fetch(`${API}/orders/${orderId}/status`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ status: 'cancelled' })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Could not cancel this order.');
        return;
      }

      loadOrders();
    } catch (err) {
      alert('Network error cancelling order.');
    }
  };

  window.submitReview = async function(orderId) {
    const starsEl = document.getElementById(`stars-${orderId}`);
    const rating  = Number(starsEl.dataset.selected || 0);
    const comment = document.getElementById(`comment-${orderId}`).value.trim();

    if (!rating) {
      alert('Please select a star rating');
      return;
    }

    try {
      const res = await fetch(`${API}/reviews`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ order_id: orderId, rating, comment })
      });

      if (!res.ok) {
        const err = await res.json();
        alert(err.error || 'Could not submit review');
        return;
      }

      document.getElementById(`reviewSlot-${orderId}`).innerHTML =
        `<p style="font-size:13px;color:#777">✓ Review submitted</p>`;
    } catch (err) {
      alert('Network error submitting review');
    }
  };

  // Check if a step is completed based on current status
  function isStepDone(currentStatus, step) {
    const steps = ['pending', 'paid', 'shipped', 'delivered'];
    return steps.indexOf(currentStatus) >= steps.indexOf(step);
  }

  // Make function available globally
  window.isStepDone = isStepDone;

  loadOrders();
</script>

<!-- ======================== -->
<!-- WHATSAPP THRIFTING SERVICE BUTTON -->
<!-- ======================== -->
<style>
  #waFabBtn {
    position: fixed;
    bottom: 24px;
    left: 24px;
    height: 52px;
    padding: 0 18px 0 14px;
    border-radius: 30px;
    background: #25D366;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 9999;
    border: none;
    transition: transform 0.2s ease;
  }
  #waFabBtn:hover { transform: scale(1.05); }
  #waFabBtn svg { width: 26px; height: 26px; flex-shrink: 0; }
  #waFabBtn span {
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }

  #waPopup {
    position: fixed;
    bottom: 96px;
    left: 24px;
    width: min(320px, calc(100vw - 32px));
    background: var(--white, #fff);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    padding: 18px;
    z-index: 9999;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  #waPopup.open { display: flex; }
  #waPopup h4 {
    color: var(--dark-brown, #5a3a22);
    font-size: 16px;
    margin-bottom: 2px;
  }
  #waPopup p {
    font-size: 13px;
    color: #555;
    line-height: 1.4;
  }
  .wa-option {
    display: block;
    text-decoration: none;
    background: var(--brown, #8b5e3c);
    color: #fff;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    transition: background 0.2s ease;
  }
  .wa-option:hover { background: var(--dark-brown, #5a3a22); }
  .wa-option small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    margin-top: 2px;
    opacity: 0.9;
  }
  #waPopupClose {
    align-self: flex-end;
    background: none;
    border: none;
    font-size: 18px;
    color: #888;
    cursor: pointer;
    line-height: 1;
  }
</style>

<button id="waFabBtn" aria-label="Chat with 3FTERS on WhatsApp" onclick="toggleWaPopup()">
  <svg viewBox="0 0 32 32" fill="#fff" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 3C9.373 3 4 8.373 4 15c0 2.34.653 4.527 1.786 6.393L4 29l7.81-1.75A11.94 11.94 0 0 0 16 27c6.627 0 12-5.373 12-12S22.627 3 16 3zm0 21.6c-1.953 0-3.77-.573-5.3-1.56l-.38-.24-4.64 1.04 1.02-4.52-.25-.39A9.55 9.55 0 0 1 5.4 15c0-5.85 4.75-10.6 10.6-10.6S26.6 9.15 26.6 15 21.85 24.6 16 24.6zm5.86-7.94c-.32-.16-1.9-.94-2.2-1.05-.3-.11-.52-.16-.73.16-.22.32-.84 1.05-1.03 1.27-.19.22-.38.24-.7.08-.32-.16-1.36-.5-2.6-1.6-.96-.86-1.6-1.92-1.79-2.24-.19-.32-.02-.5.14-.66.14-.14.32-.38.48-.57.16-.19.22-.32.32-.54.11-.22.05-.4-.02-.56-.08-.16-.73-1.75-1-2.4-.26-.63-.53-.55-.73-.56h-.62c-.22 0-.56.08-.86.4-.3.32-1.12 1.1-1.12 2.68s1.15 3.11 1.31 3.33c.16.22 2.26 3.45 5.47 4.84.76.33 1.36.53 1.82.68.77.24 1.46.21 2.02.13.62-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.29-.21-.61-.37z"/>
  </svg>
  <span>Order / Book a trip</span>
</button>

<div id="waPopup">
  <button id="waPopupClose" onclick="toggleWaPopup()">✕</button>
  <h4>Thrifting with 3FTERS </h4>
  <p>Order ahead, or bring us along to help you pick the best finds in person.</p>

  <a class="wa-option" target="_blank" rel="noopener"
     href="https://wa.me/254721153625?text=Hi%203FTERS!%20I%27d%20like%20to%20pre-order%20some%20items%20before%20they%20go%20live.%20Can%20you%20help%20me%3F">
     Order in advance
    <small>Reserve items before they're listed</small>
  </a>

  <a class="wa-option" target="_blank" rel="noopener"
     href="https://wa.me/254721153625?text=Hi%203FTERS!%20I%27d%20like%20to%20book%20a%20personal%20thrifting%20trip%20(KSh%20300%2Fhr).%20Can%20we%20arrange%20a%20time%3F">
     Book a personal thrifting trip
    <small>We shop with you in person  KSh 300/hr</small>
  </a>
</div>

<script>
  function toggleWaPopup() {
    document.getElementById('waPopup').classList.toggle('open');
  }
  document.addEventListener('click', function (e) {
    const popup = document.getElementById('waPopup');
    const fab   = document.getElementById('waFabBtn');
    if (popup.classList.contains('open') && !popup.contains(e.target) && !fab.contains(e.target)) {
      popup.classList.remove('open');
    }
  });
</script>

</body>
</html>
